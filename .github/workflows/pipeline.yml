name: Local CI-CD Pipeline

on:
  push:
    branches: [main]

jobs:

  # =========================
  # BUILD STAGE
  # =========================
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t naveen266/devops-app:${{ github.run_number }} .

      - name: Push Docker Image
        run: |
          docker push naveen266/devops-app:${{ github.run_number }}


  # =========================
  # TEST STAGE
  # =========================
  test:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Starting application tests..."
          echo "Test successfully"
          echo "All tests passed successfully"


  # =========================
  # DEPLOY STAGE
  # =========================
  deploy:
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Kubernetes Connection
        run: |
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/devops-app devops-app=naveen266/devops-app:${{ github.run_number }}

      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/devops-app --timeout=120s

      - name: Verify Deployment
        run: |
          echo "===== Kubernetes Deployment ====="
          kubectl get deployment devops-app

      - name: Verify Pods
        run: |
          echo "===== Kubernetes Pods ====="
          kubectl get pods -o wide

      - name: Verify Services
        run: |
          echo "===== Kubernetes Services ====="
          kubectl get svc
