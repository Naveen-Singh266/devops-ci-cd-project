name: Local CI-CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 3. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t naveen266/devops-app:${{ github.run_number }} .

      # 4. Push Docker Image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push naveen266/devops-app:${{ github.run_number }}

      # 5. Deploy/Update Application in Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/devops-app \
            devops-app=naveen266/devops-app:${{ github.run_number }}

      # 6. Wait for Kubernetes rollout
      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/devops-app --timeout=120s

      # 7. Verify Kubernetes Pods
      - name: Verify Pods
        run: |
          echo "===== Kubernetes Pods ====="
          kubectl get pods -o wide

      # 8. Verify Deployment
      - name: Verify Deployment
        run: |
          echo "===== Kubernetes Deployment ====="
          kubectl get deployment devops-app
```
